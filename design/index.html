<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design your journal | Sanati</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#3b2f25;--mut:#8a7a6a;--acc:#c0773a;--acc2:#e9c9a4;--line:#e6dccb;--ok:#4f8a5b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 140px}
.topbar{display:flex;justify-content:flex-end}
.topbar select{width:auto;padding:6px 8px;font-size:13px;border-radius:9px}
.hero{text-align:center;padding:6px 0 6px}
.hero h1{font:600 26px/1.2 Georgia,"Times New Roman",serif;margin:4px 0}
.hero p{color:var(--mut);margin:4px 0 0}
.steps{display:flex;gap:4px;margin:16px 0 14px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
h2{font:600 20px/1.25 Georgia,serif;margin:0 0 4px}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin:16px 0 8px}
[dir=rtl] h3,[dir=rtl] .tagline{letter-spacing:0}
.sub{color:var(--mut);font-size:13.5px;margin:0 0 12px}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=date],select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:inherit}
textarea{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;cursor:pointer;text-align:start;font:inherit;color:inherit}
.opt b{display:block;font-size:15px}.opt span{font-size:12.5px;color:var(--mut)}
.opt.on{border-color:var(--acc);background:#fdf3e8}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:none;padding:9px 6px;font:inherit;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid #f0e8da;cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:20px;height:20px;accent-color:var(--acc);margin:1px 0 0;flex:none}
.chk b{font-weight:600}.chk small{display:block;color:var(--mut);font-size:12.5px}
.chk .pp{margin-inline-start:auto;color:var(--mut);font-size:12px;white-space:nowrap;padding-inline-start:8px}
.btn{border:0;border-radius:11px;padding:12px 16px;font:600 15px/1 inherit;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn.p{background:var(--acc);color:#fff}.btn.s{background:#efe5d6;color:var(--ink)}.btn.g{background:#25d366;color:#fff}
.mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink);display:inline-block}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;background:#fffaf2}
.item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.x{border:0;background:none;color:var(--mut);font-size:20px;cursor:pointer;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ph{display:flex;align-items:center;gap:10px}
.ph img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--acc2)}
.ph .em{width:56px;height:56px;border-radius:50%;border:2px dashed var(--acc2);display:grid;place-items:center;color:var(--acc2);font-size:22px;flex:none}
.ph small{color:var(--mut);font-size:12.5px;display:block}
.cb{display:flex;gap:12px;align-items:flex-start;margin-top:10px}
.cprev{width:92px;height:auto;flex:none;background:#fdf6ec;border-radius:12px;border:1px solid var(--line)}
.cb details{flex:1;min-width:0}.cb summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px;padding:4px 0}
.ol{font-size:12.5px;color:var(--mut);margin:8px 0 4px}
.os{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);flex:none;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2.5px var(--acc)}
.th{width:50px;height:50px;border-radius:10px;border:1.5px solid var(--line);background:#fff;flex:none;cursor:pointer;padding:1px}
.th.on{border-color:var(--acc);background:#fdf3e8}.th.hs{width:64px;height:auto;padding:2px 1px 4px;font-size:11px;line-height:1.1;color:var(--mut,#7d6d5d)}.th.hs img{height:auto;aspect-ratio:160/270}.os.hsr{flex-wrap:wrap}.th img{width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,248,.97);border-top:1px solid var(--line);backdrop-filter:blur(6px);z-index:5}
.bar .in{max-width:640px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
.price{flex:1;min-width:0}
.price b{font:700 22px/1 Georgia,serif;display:block}
.price small{color:var(--mut);font-size:12px}
.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.08);color:var(--acc)}}
.err{color:#b4462f;font-size:13px;margin-top:8px}
.note{background:#fdf3e8;border:1px dashed var(--acc2);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.done{border-color:#25d366;background:#f1fbf4}
table.sum{width:100%;border-collapse:collapse;font-size:14px}
table.sum td{padding:6px 0;border-bottom:1px solid #f0e8da;vertical-align:top}
table.sum td:last-child{text-align:end;padding-inline-start:10px}
table.sum tr.t td{font-weight:700;font-size:16px;border-bottom:0;padding-top:10px}
.hide{display:none!important}
.tagline{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
</style>
</head>

</div>

</div></div>

  <tr><td>${t("datesL")}</td><td>${longD(START,loc)} ${t("to")} ${longD(END,loc)}</td></tr>
  <tr><td>${t("specials")}</td><td>${occ.length||t("none")}</td></tr>
  ${UPLOAD?`<tr><td>${t("photos")}</td><td>${photoList().length||t("none")}</td></tr>`:""}
  ${O.city.trim()?`<tr><td>${t("delivH")}</td><td>${esc(O.city)}</td></tr>`:""}
  <tr><td>${t("journal")} (${p.pages} ${t("pages")}, A5)</td><td>${money(p.journal)}</td></tr>
  ${SHOP.addons.filter(a=>O.addons.includes(a.id)).map(a=>`<tr><td>${esc(a.label)}</td><td>${money(a.price)}</td></tr>`).join("")}
  <tr class="t"><td>${t("total")}</td><td>${money(p.total)}</td></tr></table>
  <div class="sub" style="margin-top:6px">${t("plusDeliv")}</div>
  <div class="note">${t("sendNote")}</div>
  <button class="mini" id="copy">${t("copy")}</button> <span id="copied" class="sub"></span></div>`;
}

/* ================= binding ================= */
function bindFaces(root){root.querySelectorAll("[data-pphoto]").forEach(e=>e.onchange=()=>{photoOne(e.dataset.pphoto,e.files[0]);e.value="";});
  root.querySelectorAll("[data-face]").forEach(b=>b.onclick=()=>{const [who,k,val]=b.dataset.face.split("|");setFace(who,k,val);
  const el=$("cb-"+who),sc=[...el.querySelectorAll(".os")].map(x=>x.scrollLeft);el.outerHTML=charBlock(who);const n=$("cb-"+who);
  n.querySelectorAll(".os").forEach((x,i)=>x.scrollLeft=sc[i]||0);const d=n.querySelector("[data-cbd]");d.ontoggle=()=>{if(d.open)CB_OPEN.add(who);else CB_OPEN.delete(who);};bindFaces(n);});}
const persOf=who=>who.startsWith("kid")?O.kids[+who.slice(3)]:O.persona[who];
function bindView(){
  $("view").oninput=$("view").onchange=()=>{const er=$("err");if(er&&er.textContent)er.textContent="";};
  const v=$("view"),q=s=>v.querySelectorAll(s),on=(id,f)=>{const e=$(id);if(e)e.oninput=f;};
  q("[data-ev]").forEach(b=>b.onclick=()=>{applyEvent(b.dataset.ev);render();});
  q("[data-seg]").forEach(sg=>sg.querySelectorAll("button").forEach(b=>b.onclick=()=>{const k=sg.dataset.seg,val=b.dataset.v;if(k==="couple")O.couple=val==="1";else{O[k]=val;if(k==="ownerG")delete O.av.owner;if(k==="partnerG")delete O.av.partner;}render();}));
  ["owner","partner","familyName","buyer","phone","city","address","notes","start","eventDate"].forEach(k=>on(k,e=>{O[k]=e.target.value;updateBar();}));
  on("length",e=>{O.length=+e.target.value;updateBar();});on("lang",e=>{O.lang=e.target.value;updateBar();});on("weekStart",e=>{O.weekStart=+e.target.value;updateBar();});
  const fam=$("family");if(fam)fam.onchange=()=>{O.family=fam.checked;if(O.family&&!O.kids.length)O.kids.push(newKid());render();};
  const ka=$("kidAdd");if(ka)ka.onclick=()=>{O.kids.push(newKid());render();};
  q("[data-krm]").forEach(b=>b.onclick=()=>{[0,1,2].forEach(j=>{if(j>=+b.dataset.krm){delete PH["kid"+j];delete O.photos["kid"+j];}});O.kids.splice(+b.dataset.krm,1);if(!O.kids.length)O.family=false;render();});
  q("[data-kid]").forEach(e=>e.oninput=()=>{const k=O.kids[+e.dataset.kid];k[e.dataset.f]=e.value;if(e.dataset.f==="g"){k.av=null;render();return;}if(e.dataset.f==="birthday"){const w="kid"+e.dataset.kid,el=$("cb-"+w);if(el){el.outerHTML=charBlock(w);bindFaces($("cb-"+w));}}updateBar();});
  q("[data-dm]").forEach(e=>e.onchange=()=>{const k=e.dataset.dm,d=+v.querySelector(`[data-dm="${k}"][data-p="d"]`).value,m=+v.querySelector(`[data-dm="${k}"][data-p="m"]`).value;
    O[k]=d&&m?`2000-${pad(m)}-${pad(Math.min(d,daysIn(2000,m)))}`:"";updateBar();});
  q("[data-cbd]").forEach(d=>d.ontoggle=()=>{if(d.open)CB_OPEN.add(d.dataset.cbd);else CB_OPEN.delete(d.dataset.cbd);});
  bindFaces(v);bindUploads(v);
  const gp=$("gphoto");if(gp)gp.onchange=()=>{photoGroup(gp.files[0]);gp.value="";};
  q("[data-trait]").forEach(b=>b.onclick=()=>{const [who,x]=b.dataset.trait.split("|"),p=persOf(who);if(!p)return;
    if(p.traits.includes(x))p.traits=p.traits.filter(y=>y!==x);else if(p.traits.length<3)p.traits.push(x);
    b.parentNode.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",p.traits.includes(c.dataset.trait.split("|")[1])));save();});
  q("[data-note]").forEach(e=>e.oninput=()=>{const p=persOf(e.dataset.note);if(p){p.note=e.value;save();}});
  const sa=$("spAdd");if(sa)sa.onclick=()=>{O.specials.push({date:"",type:"birthday",label:""});render();};
  q("[data-sprm]").forEach(b=>b.onclick=()=>{O.specials.splice(+b.dataset.sprm,1);render();});
  q("[data-sp]").forEach(e=>e.oninput=()=>{O.specials[+e.dataset.sp][e.dataset.f]=e.value;updateBar();});
  q("[data-pg]").forEach(e=>e.onchange=()=>{O.pages[e.dataset.pg]=e.checked;updateBar();});
  const ca=$("ctAdd");if(ca)ca.onclick=()=>{O.customTrackers.push({title:"",legend:""});render();};
  q("[data-ctrm]").forEach(b=>b.onclick=()=>{O.customTrackers.splice(+b.dataset.ctrm,1);render();});
  q("[data-ct]").forEach(e=>e.oninput=()=>{O.customTrackers[+e.dataset.ct][e.dataset.f]=e.value;updateBar();});
  q("[data-add]").forEach(e=>e.onchange=()=>{const id=e.dataset.add;O.addons=O.addons.filter(x=>x!==id);if(e.checked)O.addons.push(id);render();});
  const cp=$("copy");if(cp)cp.onclick=async()=>{const m=MSG||await message();try{await navigator.clipboard.writeText(m);$("copied").textContent=t("copied");}catch(e){prompt(t("copy"),m);}};
  const no=$("newOrder");if(no)no.onclick=()=>{const keep={ui:O.ui,lang:O.lang,buyer:O.buyer,phone:O.phone,city:O.city,address:O.address};O=Object.assign(defaults(),keep);for(const k in PH)delete PH[k];SENT=false;go(0);};
  const wl=$("waLink");if(wl)wl.onclick=()=>{wl.href=waUrl();};
}
$("back").onclick=()=>go(STEP-1);
$("next").onclick=async()=>{
  const e=check(STEP);if(e){const er=$("err");if(er){er.textContent=e;er.scrollIntoView({block:"center",behavior:"smooth"});}return;}
  if(STEP<STEPS.length-1){go(STEP+1);return;}
  for(let i=0;i<STEPS.length;i++){const m=check(i);if(m){go(i);setTimeout(()=>{const er=$("err");if(er)er.textContent=m;},50);return;}}
  if(uploading()){const er=$("err");if(er){er.textContent=t("phWait");er.scrollIntoView({block:"center",behavior:"smooth"});}return;}
  if(!MSG)MSG=await message();
  if(UPLOAD&&O.photoFolder)try{fetch(UPLOAD,{method:"POST",keepalive:true,headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({order:O.orderId,action:"name",label:[O.owner,O.buyer,O.city].filter(Boolean).join(" - ")})}).catch(()=>{});}catch(e){}
  if(SHOP.whatsapp)window.open(waUrl(),"_blank","noopener");
  else{try{await navigator.clipboard.writeText(MSG);}catch(x){}}
  SENT=true;const keep=MSG;render();MSG=keep;window.scrollTo({top:0,behavior:"smooth"});
  if(!SHOP.whatsapp){const c=$("copied");if(c)c.textContent=t("copied");}
};
$("ui").innerHTML=LANGS.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");$("ui").value=O.ui;
$("ui").onchange=()=>{const nl=$("ui").value;O.ui=nl;O.lang=nl;if(nl==="ar"&&!O.weekStart)O.weekStart=5;else if(nl!=="ar"&&O.weekStart===5)O.weekStart=0;render();};

/* ================= order code ================= */
async function encode(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  const b64=u=>{let s="";u.forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");};
  try{const cs=new CompressionStream("deflate-raw");const buf=await new Response(new Blob([raw]).stream().pipeThrough(cs)).arrayBuffer();return "JS1."+b64(new Uint8Array(buf));}
  catch(e){return "JS0."+b64(raw);}
}
async function message(){
  const p=priceOf(),occ=occasions(),E=T.en;
  const o=JSON.parse(JSON.stringify(O));delete o.ui;const pl=photoList();o.photos=pl.map(w=>O.photos[w]);if(!pl.length){delete o.photoFolder;}o.price=p.total;o.pageCount=p.pages;const fo=w=>{const f=faceOf(w),x=(srcAv(w)||{}).outfit;if(x)f.outfit=x;return f;};o.av={};["owner","partner"].forEach(w=>{if(O.av[w])o.av[w]=fo(w);});o.kids=(o.kids||[]).map((k,i)=>Object.assign(k,{av:fo("kid"+i)}));
  if(!o.couple){o.partner="";o.partnerBday="";o.persona.partner={traits:[],note:""};}
  if(!o.family)o.kids=[];
  o.pagesOn=Object.keys(o.pages).filter(k=>o.pages[k]);o.pagesOff=Object.keys(o.pages).filter(k=>!o.pages[k]);delete o.pages;
  const code=await encode(o);
  const people=[O.owner,O.couple?O.partner:"",...(O.family?O.kids.map(k=>k.name):[])].filter(Boolean).join(", ");
  const lines=[`Hi! I'd like to order a personalised journal.`,``,
    `Occasion: ${E["ev_"+O.event]||""}`,`Characters: ${people}`,`Dates: ${longD(START)} to ${longD(END)}`,
    occ.length?`Special days: ${occ.map(x=>`${x.type==="birthday"&&x.label?x.label+" birthday":(x.label||occName(x.type,"en"))} (${longD(x.date)})`).join(", ")}`:null,
    `Language: ${(LANGS.find(l=>l[0]===O.lang)||[,""])[1]}`,`Pages: ${p.pages}`,
    O.addons.length?`Extras: ${SHOP.addons.filter(a=>O.addons.includes(a.id)).map(a=>a.label).join(", ")}`:null,
    `Total: ${money(p.total)} (before delivery)`,``,`Deliver to: ${O.buyer}, ${O.phone}`,`${O.city}: ${O.address.replace(/\s*\n\s*/g,", ")}`,O.notes.trim()?`Notes: ${O.notes.trim().replace(/\s*\n\s*/g," / ")}`:null,``,
    pl.length&&O.photoFolder?`Photos (${pl.length}): ${O.photoFolder}`:null,pl.length&&O.photoFolder?``:null,
`Order code: ${code}`];
  return lines.filter(l=>l!==null).join("\n");
}
render();
</script>
