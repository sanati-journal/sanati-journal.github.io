*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:inherit}
.w{max-width:1080px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;line-height:1.15;margin:0}
h1{font-size:clamp(34px,6vw,58px)}
h2{font-size:clamp(26px,4vw,38px);margin-bottom:10px}
h3{font-size:20px;margin-bottom:6px}
p{margin:0}
.mut{color:var(--mut)}
.kick{display:inline-block;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:600;margin-bottom:12px}

.btn{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;font-weight:600;padding:15px 26px;border-radius:12px;font-size:16px;border:0;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:hover{filter:brightness(1.05)}

/* nav */
nav{position:sticky;top:0;z-index:20;background:rgba(246,241,231,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .w{display:flex;align-items:center;gap:14px;height:62px}
.brand{font:600 20px Georgia,serif;text-decoration:none;margin-inline-end:auto}
nav .links a{text-decoration:none;color:var(--mut);font-size:14.5px;margin-inline-start:18px}
nav .btn{padding:10px 16px;font-size:14.5px}
.lang{background:none;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
.brand{white-space:nowrap}
@media(max-width:760px){nav .links{display:none}nav .btn{display:none}}

/* hero */
.hero{padding:56px 0 40px}
.hero .w{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.hero p.lead{font-size:19px;color:var(--mut);margin:18px 0 28px;max-width:520px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero .from{font-size:14.5px;color:var(--mut);margin-top:14px}
.stack{position:relative;height:560px}
.stack img{position:absolute;width:52%;height:auto;border-radius:8px;box-shadow:0 18px 40px rgba(59,47,37,.18),0 2px 6px rgba(59,47,37,.08);background:#fff}
.stack img:nth-child(1){left:2%;top:40px;transform:rotate(-6deg)}
.stack img:nth-child(2){left:40%;top:0;transform:rotate(4deg);z-index:2}
.stack img:nth-child(3){left:22%;top:110px;transform:rotate(-1deg);z-index:3}
[dir=rtl] .stack{direction:ltr}
@media(max-width:860px){.hero .w{grid-template-columns:1fr}.stack{height:400px;max-width:400px;margin:10px auto -10px;width:100%}}

/* strips */
.trust{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card)}
.trust .w{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-top:18px;padding-bottom:18px;text-align:center}
.trust b{display:block;font:600 22px Georgia,serif}
.trust span{font-size:13.5px;color:var(--mut)}
@media(max-width:700px){.trust .w{grid-template-columns:repeat(2,1fr);row-gap:16px}}

section{padding:76px 0}
.head{max-width:640px;margin-bottom:34px}
.head.c{text-align:center;margin-inline:auto}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:s}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.step:before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--acc);font:700 16px Georgia,serif;margin-bottom:14px}
.step p{color:var(--mut);font-size:15px}
@media(max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.steps{grid-template-columns:1fr}}

/* gallery */
.gal{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 20px 22px;margin:0 -20px;scrollbar-width:thin}
.gal figure{margin:0;flex:none;width:250px;scroll-snap-align:start}
.gal img{width:100%;height:auto;border-radius:8px;box-shadow:0 10px 26px rgba(59,47,37,.14);background:#fff;display:block}
.gal figcaption{font-size:14px;color:var(--mut);margin-top:10px;text-align:center}
.galnav{display:flex;gap:8px;justify-content:flex-end;margin-top:-6px}
.galnav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;color:var(--ink)}

/* features */
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feat div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.feat .ic{font-size:26px;margin-bottom:10px;display:block}
.feat p{color:var(--mut);font-size:15px}
@media(max-width:900px){.feat{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.feat{grid-template-columns:1fr}}

/* occasions */
.occ{display:flex;flex-wrap:wrap;gap:10px}
.occ span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:10px 16px;font-size:15px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
.split img{width:100%;height:auto;max-width:380px;border-radius:8px;box-shadow:0 16px 36px rgba(59,47,37,.16);display:block;margin:auto}
@media(max-width:820px){.split{grid-template-columns:1fr}}

/* pricing */
.price{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.price .big{font:700 44px Georgia,serif}
.price ul{margin:14px 0 0;padding:0;list-style:none;color:var(--mut)}
.price li{padding:4px 0}.price li:before{content:"✓";color:var(--acc);font-weight:700;margin-inline-end:9px}
@media(max-width:700px){.price{grid-template-columns:1fr}}

/* reviews */
.revs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.revs blockquote{margin:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;font-size:15.5px}
.revs cite{display:block;margin-top:12px;font-style:normal;color:var(--mut);font-size:14px}
.stars{color:var(--acc);letter-spacing:2px;margin-bottom:8px}
@media(max-width:820px){.revs{grid-template-columns:1fr}}

/* faq */
.faq details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:10px}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";color:var(--acc);font-size:22px;line-height:1}
.faq details[open] summary:after{content:"−"}
.faq details p{color:var(--mut);margin-top:10px}

.final{background:var(--ink);color:#fbf5ea;border-radius:24px;padding:56px 30px;text-align:center}
.final p{color:#d9cbb8;margin:12px auto 26px;max-width:520px}
footer{padding:34px 0 90px;color:var(--mut);font-size:14px}
footer .w{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wa{position:fixed;bottom:18px;inset-inline-end:18px;z-index:30;background:#25d366;color:#fff;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.2);text-decoration:none}
.wa svg{width:28px;height:28px}
.mcta{display:none}
